<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#27ae60">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stock Check">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Stock Check</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f7f6; font-family: Arial, sans-serif; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #offline { display: none; padding: 40px 20px; text-align: center; color: #555; }
    #offline button { margin-top: 15px; padding: 12px 24px; background: #27ae60; color: #fff; border: 0; border-radius: 4px; font-size: 16px; }
  </style>
</head>
<body>
  <!-- ▼▼▼ PASTE YOUR APPS SCRIPT /exec LINK BETWEEN THE QUOTES ▼▼▼ -->
  <script>var APP_URL = 'https://script.google.com/macros/s/AKfycbxAvXiQxXX3TxhHZ-Ds2yFKhYhSU6c0KRmmhiXzaMKgMSPGea7wcUU_7vw94AxIDx3oag/exec';</script>

  <iframe id="app" allow="clipboard-write"></iframe>
  <div id="offline">
    <h3>No internet connection</h3>
    <p>Stock Check needs internet to load. Please check your Wi-Fi or data.</p>
    <button onclick="location.reload()">Try again</button>
  </div>

  <script>
    if (navigator.onLine) {
      document.getElementById('app').src = APP_URL;
    } else {
      document.getElementById('app').style.display = 'none';
      document.getElementById('offline').style.display = 'block';
    }
    window.addEventListener('online', function () { location.reload(); });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
